<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>⚽ Penalty Shootout Game</title>
    <!-- Loads the official stable CheerpJ runtime -->
    <script src="https://leaningtech.com"></script>
</head>
<body style="margin:0; background:#222; display:flex; justify-content:center; align-items:center; height:100vh;">
    <script>
        (async function () {
            // Initialize the Java runtime environment 
            await cheerpjInit();
            // Sets a standard display layout box
            cheerpjCreateDisplay(800, 600);
            // Points directly to your EXACT project JAR file
            await cheerpjRunJar("/app/PenaltyShootoutProject.jar");
        })();
    </script>
</body>
</html>
