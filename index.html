<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>⚽ Penalty Shootout Game</title>
    <!-- Loads the CheerpJ web translator framework -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body style="margin:0; background:#222; display:flex; justify-content:center; align-items:center; height:100vh;">
    <script>
        (async function () {
            // Initialize the Java virtual machine environment in the browser
            await cheerpjInit();
            // Creates the visual canvas display box (width, height)
            cheerpjCreateDisplay(800, 600);
            // Launches your compiled game JAR file
            await cheerpjRunJar("/app/PenaltyShootoutProject.jar");
        })();
    </script>
</body>
</html>
